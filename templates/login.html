<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - StudySmart AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center font-sans antialiased">

    <div class="max-w-md w-full bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                <span class="text-3xl">📚</span>
            </div>
            <h2 class="text-2xl font-bold text-slate-100">Chào mừng trở lại!</h2>
            <p class="text-slate-400 text-sm mt-1">Đăng nhập để tiếp tục lộ trình học tập</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm mb-6 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Tên đăng nhập</label>
                <input type="text" name="username" required 
                       class="w-full bg-slate-950/60 border border-slate-700 p-3 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder-slate-600" 
                       placeholder="Nhập username của bạn">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
                <input type="password" name="password" required 
                       class="w-full bg-slate-950/60 border border-slate-700 p-3 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder-slate-600" 
                       placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all duration-300">
                Đăng nhập
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            Chưa có tài khoản? <a href="/register" class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors">Đăng ký ngay</a>
        </p>
    </div>

</body>
</html>
