<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - StudySmart AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center font-sans antialiased relative overflow-hidden">

    <!-- Hạt sáng trang trí background -->
    <div class="absolute -top-10 -left-10 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-72 h-72 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl border border-slate-800 shadow-2xl z-10">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                <span class="text-2xl text-white"><i class="fa-solid fa-user-plus"></i></span>
            </div>
            <h2 class="text-2xl font-bold text-slate-100">Tạo tài khoản mới</h2>
            <p class="text-slate-400 text-xs mt-1">Bắt đầu hành trình học tập cùng AI Gia sư</p>
        </div>

        <!-- Thông báo lỗi nếu có -->
        {% if error %}
        <div class="bg-red-500/20 border border-red-500/40 text-red-400 p-3 rounded-xl text-xs mb-5 text-center flex items-center justify-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i> <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <!-- Ô nhập Tên đăng nhập -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Tên đăng nhập</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                           class="w-full bg-slate-950/60 border border-slate-800 pl-10 pr-4 py-3 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 text-sm transition-all placeholder-slate-600" 
                           placeholder="Chọn tên tài khoản">
                </div>
            </div>

            <!-- Ô NHẬP EMAIL (MỚI THÊM) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Địa chỉ Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required 
                           class="w-full bg-slate-950/60 border border-slate-800 pl-10 pr-4 py-3 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 text-sm transition-all placeholder-slate-600" 
                           placeholder="VD: hocsinh@gmail.com">
                </div>
            </div>

            <!-- Ô nhập Mật khẩu -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required minlength="6"
                           class="w-full bg-slate-950/60 border border-slate-800 pl-10 pr-4 py-3 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 text-sm transition-all placeholder-slate-600" 
                           placeholder="Tối thiểu 6 ký tự">
                </div>
            </div>

            <!-- Nút bấm Đăng ký -->
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] transition-all duration-300 text-sm mt-2">
                Đăng ký tài khoản
            </button>
        </form>

        <p class="text-center text-slate-400 text-xs mt-5">
            Đã có tài khoản rồi? <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-semibold transition-colors">Đăng nhập ngay</a>
        </p>
    </div>

</body>
</html>
