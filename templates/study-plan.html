<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Study Plan Pro Max</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-6xl mx-auto p-6">

<h1 class="text-3xl font-bold text-blue-700 mb-4">
📅 Study Plan Pro Max
</h1>

<!-- STREAK + XP -->
<div class="bg-white p-4 rounded-xl shadow mb-6 flex justify-between">
    <div>🔥 Streak: <b>{{ streak }}</b></div>
    <div>⚡ XP: <b>{{ xp }}</b></div>
</div>

<!-- PROGRESS -->
<div class="bg-white p-4 rounded-xl shadow mb-6">
    <div class="flex justify-between mb-2">
        <span>Tiến độ</span>
        <span>{{ done }}/{{ total }}</span>
    </div>

    <div class="w-full bg-gray-200 h-3 rounded-full">
        <div class="bg-green-500 h-3 rounded-full"
             style="width: {{ (done/total*100) if total else 0 }}%">
        </div>
    </div>
</div>

<!-- DAYS -->
<div class="grid md:grid-cols-2 gap-4">

{% for day in plan %}

{% set day_key = "day_" ~ loop.index0 %}

<div class="bg-white p-5 rounded-xl shadow border-l-4 border-blue-500">

    <h2 class="font-bold text-lg mb-2">
        {{ day.day }} - {{ day.date }}
    </h2>

    <p class="text-sm mb-2 text-gray-700">
        📘 {{ day.topic }}
    </p>

    <div class="space-y-2">

    {% for task in day.schedule %}

        <label class="flex items-center gap-2 text-sm">

            <input type="checkbox"
                   onchange="toggleTask('{{ day_key }}','{{ task }}')"
                   {% if progress.get(day_key) and task in progress.get(day_key) %}
                   checked
                   {% endif %}
            >

            <span>{{ task }}</span>
        </label>

    {% endfor %}

    </div>

</div>

{% endfor %}

</div>

</div>

<script>

function toggleTask(day, task) {
    fetch("/toggle-task", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({day, task})
    });
}

</script>

</body>
</html>
